<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<style>
  body{
    width:300px;margin:0;padding:16px;
    font-family:-apple-system,"Segoe UI",sans-serif;
    background:#141c18;color:#e9efe9;
  }
  h1{font-size:13px;margin:0 0 14px;letter-spacing:.03em;color:#8fa091;font-weight:600;}
  .row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12.5px;}
  .row span:first-child{color:#8fa091;}
  label{display:block;font-size:12px;color:#8fa091;margin-top:10px;margin-bottom:4px;}
  select, button{
    width:100%;padding:8px;border-radius:6px;border:1px solid #26332b;
    background:#1a231d;color:#e9efe9;font-size:13px;box-sizing:border-box;
  }
  button{
    background:#1d5c3d;border-color:#3ddc84;color:#3ddc84;font-weight:600;
    cursor:pointer;margin-top:14px;
  }
  button:disabled{opacity:.6;cursor:default;}
  .ok{color:#3ddc84;}
  .err{color:#ff6a5f;}
  #lastError{
    font-size:11.5px;color:#ffd7d2;margin-top:10px;background:#5c2a26;
    padding:8px;border-radius:6px;display:none;line-height:1.4;
  }
  .hint{font-size:11px;color:#5c6c60;margin-top:14px;line-height:1.5;}
</style>
</head>
<body>
  <h1>TRADE HISTORY AUTO-ARCHIVER</h1>
  <div class="row"><span>Lần chạy gần nhất</span><span id="lastRun">—</span></div>
  <div class="row"><span>Kết quả</span><span id="lastStatus">—</span></div>
  <div class="row"><span>Số lệnh lấy được</span><span id="lastCount">—</span></div>
  <div id="lastError"></div>

  <label for="interval">Tần suất tự động</label>
  <select id="interval">
    <option value="1440">Mỗi ngày</option>
    <option value="4320">Mỗi 3 ngày</option>
    <option value="10080">Mỗi tuần</option>
    <option value="20160">Mỗi 2 tuần</option>
  </select>

  <button id="runNow">Chạy ngay</button>

  <div class="hint">
    File JSON sẽ tự lưu vào thư mục Download mặc định của Chrome, trong thư mục con
    <b>TradeHistoryArchive</b>. Muốn lưu ở nơi khác (VD: thư mục Google Drive để tự đồng bộ),
    đổi thư mục Download mặc định trong Cài đặt Chrome.
  </div>

  <script src="popup.js"></script>
</body>
</html>
